<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1218">
<title>APEX FC — Reach Your Peak</title>
<style>
:root{--bg:#0b1218;--panel:#14212a;--panel2:#1c2d37;--line:#2b404c;--text:#f4f7f8;--muted:#9aabb5;--green:#b5f52b;--blue:#35a9e8;--danger:#ff7272}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,#142d3a 0,transparent 32%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}
.sidebar{padding:26px 18px;border-right:1px solid var(--line);background:#0a1117;display:flex;flex-direction:column;gap:24px}
.brand{font-weight:950;font-size:25px;letter-spacing:1px}.brand span{color:var(--green)}.tag{font-size:10px;letter-spacing:2px;color:var(--green);font-weight:800}
.nav{display:grid;gap:8px}.nav button{border:0;background:transparent;color:var(--muted);padding:12px 14px;border-radius:12px;text-align:left;font-weight:700}.nav button.active,.nav button:hover{background:#1b2c35;color:var(--green)}
.sidebar-note{margin-top:auto;color:var(--muted);font-size:12px}
main{padding:30px;max-width:1250px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;gap:15px}.top h1{font-size:27px;margin:0}.eyebrow{color:var(--green);font-weight:800;font-size:11px;letter-spacing:1.5px}
.grid{display:grid;gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:19px;min-width:0}.card h2,.card h3{margin:0 0 12px}.muted{color:var(--muted)}.small{font-size:12px}.big{font-size:30px;font-weight:900;line-height:1.1}.green{color:var(--green)}.blue{color:var(--blue)}
.btn{border:0;border-radius:11px;padding:10px 15px;font-weight:800;background:var(--green);color:#14200a}.btn.secondary{background:#263b47;color:var(--text);border:1px solid var(--line)}.btn:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{width:100%;background:#0e1920;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--green)}label{display:block;color:var(--muted);font-size:12px;margin:0 0 6px;font-weight:700}.field{margin:10px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-block;padding:4px 9px;border-radius:99px;background:#263c34;color:var(--green);font-size:11px;font-weight:800}
.progress{height:9px;background:#334650;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:99px}
.stat{font-size:27px;font-weight:900}.barrow{display:grid;grid-template-columns:90px 1fr 35px;align-items:center;gap:10px;margin:12px 0}.bar{height:8px;background:#344751;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.drill,.player,.history{padding:14px;border-radius:13px;background:#10202a;border:1px solid var(--line);margin:9px 0}.drill.done{border-color:#709d26}.check{accent-color:var(--green);width:auto}
.chart{height:130px;display:flex;align-items:end;gap:10px;padding-top:12px}.chart div{flex:1;background:linear-gradient(var(--blue),#24607b);border-radius:7px 7px 2px 2px;min-width:8px;position:relative}.chart div.today{background:linear-gradient(var(--green),#739e1c)}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.mobilebar{display:none}
.toast{position:fixed;right:20px;bottom:20px;background:#203526;border:1px solid #557b29;color:var(--green);padding:12px 16px;border-radius:12px;display:none}
@media(max-width:850px){.app{display:block}.sidebar{display:none}main{padding:20px 15px 90px}.grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#091117;border-top:1px solid var(--line);padding:7px;justify-content:space-around;z-index:5}.mobilebar button{background:transparent;border:0;color:var(--muted);font-size:11px;padding:7px 4px}.mobilebar button.active{color:var(--green)}}
@media(max-width:560px){.grid.two,.grid.three{grid-template-columns:1fr}.top h1{font-size:22px}.top{align-items:flex-start}.card{padding:16px}.barrow{grid-template-columns:75px 1fr 30px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div><div class="brand">APEX <span>FC</span></div><div class="tag">REACH YOUR PEAK.</div></div>
  <nav class="nav" id="sideNav"></nav>
  <div class="sidebar-note">PLAYER DEVELOPMENT PLATFORM<br>Prototype v0.1 • Your progress stays on this device.</div>
</aside>
<main>
  <div class="top"><div><div class="eyebrow">APEX FC / PLAYER DEVELOPMENT</div><h1 id="pageTitle">Your dashboard</h1></div><span class="pill">BETA MVP</span></div>
  <section id="view"></section>
</main>
<nav class="mobilebar" id="mobileNav"></nav>
</div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const pages=[["home","⌂","Home"],["profile","◎","Profile"],["training","⚡","Training"],["progress","↗","Progress"],["matches","◉","Matches"],["scouting","⌕","Scouting"]];
const defaults={profile:{name:"",age:"",position:"CAM",foot:"Right",club:""},sessions:[],matches:[],scouts:[],xp:0,level:1,attributes:{Pace:60,Shooting:60,Passing:60,Dribbling:60,Defending:60,Vision:60}};
let data={...defaults,...JSON.parse(localStorage.getItem("apexfc-data")||"{}")};
function save(){localStorage.setItem("apexfc-data",JSON.stringify(data))}
function toast(t){let el=$("#toast");el.textContent=t;el.style.display="block";setTimeout(()=>el.style.display="none",2200)}
function nav(active){const make=pages.map(([id,ic,n])=>`<button class="${id===active?'active':''}" data-page="${id}">${ic} &nbsp;${n}</button>`).join("");$("#sideNav").innerHTML=make;$("#mobileNav").innerHTML=pages.map(([id,ic,n])=>`<button class="${id===active?'active':''}" data-page="${id}">${ic}<br>${n}</button>`).join("");document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>render(b.dataset.page))}
function cardStat(label,val,sub=""){return `<div class="card"><div class="muted small">${label}</div><div class="big green">${val}</div><div class="muted small">${sub}</div></div>`}
function render(page="home"){nav(page);const titles={home:"Your dashboard",profile:"Player profile",training:"Training centre",progress:"Progress dashboard",matches:"Match tracker",scouting:"Scouting centre"};$("#pageTitle").textContent=titles[page];const v=$("#view");
if(page==="home"){v.innerHTML=`<div class="grid two"><div class="card"><div class="eyebrow">WELCOME TO APEX FC</div><h2>${data.profile.name?`Welcome back, ${esc(data.profile.name)}`:"Build your football journey."}</h2><p class="muted">Train with purpose. Track your progress. Keep improving.</p><button class="btn" onclick="render('training')">Start training →</button></div><div class="card"><div class="row"><div><div class="muted small">PLAYER LEVEL</div><div class="big">LEVEL ${data.level}</div></div><span class="pill">${data.xp} XP</span></div><div class="progress" style="margin:15px 0"><i style="width:${data.xp%500/5}%"></i></div><div class="muted small">${500-data.xp%500} XP to next level</div></div></div><div class="grid three" style="margin-top:16px">${cardStat("TRAINING SESSIONS",data.sessions.length,"Saved sessions")}${cardStat("MATCHES PLAYED",data.matches.length,"Recorded matches")}${cardStat("GOALS",data.matches.reduce((s,m)=>s+Number(m.goals),0),"Across recorded matches")}</div><div class="card" style="margin-top:16px"><h3>Quick access</h3><div class="actions"><button class="btn" onclick="render('profile')">Set up profile</button><button class="btn secondary" onclick="render('training')">Training centre</button><button class="btn secondary" onclick="render('matches')">Record a match</button></div></div>`}
if(page==="profile"){let p=data.profile;v.innerHTML=`<div class="card"><h2>Your player profile</h2><div class="grid two"><div class="field"><label>PLAYER NAME</label><input id="pname" value="${esc(p.name)}" placeholder="Your name"></div><div class="field"><label>AGE</label><input id="page" type="number" min="8" max="99" value="${esc(p.age)}" placeholder="Age"></div><div class="field"><label>POSITION</label><select id="ppos">${["GK","CB","FB","CDM","CM","CAM","Winger","ST"].map(x=>`<option ${p.position===x?'selected':''}>${x}</option>`).join("")}</select></div><div class="field"><label>PREFERRED FOOT</label><select id="pfoot"><option ${p.foot==="Right"?"selected":""}>Right</option><option ${p.foot==="Left"?"selected":""}>Left</option><option ${p.foot==="Both"?"selected":""}>Both</option></select></div><div class="field"><label>CLUB (OPTIONAL)</label><input id="pclub" value="${esc(p.club)}" placeholder="Club or academy"></div></div><button class="btn" id="saveProfile">Save profile</button></div><div class="card" style="margin-top:16px"><h3>Player attributes</h3><p class="muted small">Use these as personal tracking estimates, not official talent scores.</p>${Object.entries(data.attributes).map(([k,val])=>`<div class="barrow"><label>${k}</label><input aria-label="${k}" type="range" min="1" max="100" value="${val}" data-attr="${k}"><b>${val}</b></div>`).join("")}</div>`;
$("#saveProfile").onclick=()=>{data.profile={name:$("#pname").value,age:$("#page").value,position:$("#ppos").value,foot:$("#pfoot").value,club:$("#pclub").value};save();toast("Profile saved on this device")};
document.querySelectorAll("[data-attr]").forEach(el=>el.oninput=()=>{data.attributes[el.dataset.attr]=Number(el.value);el.nextElementSibling.textContent=el.value;save()})}
if(page==="training"){const drills=[["Close Control","Dribbling","3 sets","15 min"],["Passing Accuracy","Passing","3 sets","15 min"],["First Touch","Ball control","2 sets","10 min"],["Scanning & Awareness","Vision","2 sets","10 min"]];v.innerHTML=`<div class="card"><div class="eyebrow">TODAY'S TRAINING</div><h2>Technical development</h2><p class="muted">Choose drills, complete them at a comfortable pace and record your session. Warm up first and take breaks.</p><div id="drills">${drills.map((d,i)=>`<label class="drill"><div class="row"><strong>${d[0]}</strong><span class="pill">${d[2]}</span></div><div class="muted small">${d[1]} • ${d[3]}</div><input class="check" type="checkbox" data-drill="${i}"> Mark completed</label>`).join("")}</div><div class="field"><label>SESSION DURATION (MINUTES)</label><input id="duration" type="number" min="1" max="300" value="30"></div><div class="field"><label>SESSION NOTES</label><textarea id="tnote" rows="3" placeholder="What did you practise? What did you notice?"></textarea></div><button class="btn" id="saveSession">Save completed session</button></div><div class="card" style="margin-top:16px"><h3>Recent sessions</h3>${data.sessions.length?data.sessions.slice(0,5).map(s=>`<div class="history"><strong>${s.count} drills • ${s.duration} min</strong><div class="muted small">${esc(s.date)} — ${esc(s.notes||"No notes")}</div></div>`).join(""):'<div class="empty">Your saved sessions will appear here.</div>'}</div>`;
$("#saveSession").onclick=()=>{let count=document.querySelectorAll("[data-drill]:checked").length,duration=Number($("#duration").value);if(!count||!duration||duration<1||duration>300){toast("Complete at least one drill and enter a valid duration");return}data.sessions.unshift({count,duration,notes:$("#tnote").value,date:new Date().toLocaleDateString()});addXP(count*20);save();render("training");toast("Training session saved!")}}
if(page==="progress"){let goals=data.matches.reduce((s,m)=>s+Number(m.goals),0),assists=data.matches.reduce((s,m)=>s+Number(m.assists),0);v.innerHTML=`<div class="grid three">${cardStat("LEVEL",data.level,"Player journey")}${cardStat("TOTAL XP",data.xp,"Earned from sessions")}${cardStat("SESSIONS",data.sessions.length,"Training logged")}</div><div class="card" style="margin-top:16px"><h3>Attribute development</h3>${Object.entries(data.attributes).map(([k,val])=>`<div class="barrow"><label>${k}</label><div class="bar"><i style="width:${val}%"></i></div><b>${val}</b></div>`).join("")}</div><div class="grid two" style="margin-top:16px">${cardStat("GOALS",goals,"Recorded matches")}${cardStat("ASSISTS",assists,"Recorded matches")}</div><div class="card" style="margin-top:16px"><h3>Training history</h3>${data.sessions.length?data.sessions.slice(0,8).map(s=>`<div class="history">${s.date} • ${s.duration} minutes • ${s.count} drills</div>`).join(""):'<div class="empty">Record training to build your progress history.</div>'}</div>`}
if(page==="matches"){v.innerHTML=`<div class="card"><h2>Record a match</h2><div class="grid two"><div class="field"><label>OPPONENT</label><input id="opponent" placeholder="Team name"></div><div class="field"><label>COMPETITION</label><select id="competition"><option>Friendly</option><option>League</option><option>Cup</option><option>Tournament</option></select></div><div class="field"><label>RESULT</label><select id="result"><option>Win</option><option>Draw</option><option>Loss</option></select></div><div class="field"><label>MINUTES PLAYED</label><input id="minutes" type="number" min="0" max="120" value="90"></div><div class="field"><label>GOALS</label><input id="goals" type="number" min="0" value="0"></div><div class="field"><label>ASSISTS</label><input id="assists" type="number" min="0" value="0"></div><div class="field"><label>MATCH RATING /10</label><input id="rating" type="number" min="1" max="10" step=".1" value="7"></div><div class="field"><label>PLAYER OF THE MATCH?</label><select id="potm"><option value="no">No</option><option value="yes">Yes</option></select></div></div><button class="btn" id="saveMatch">Save match</button></div><div class="card" style="margin-top:16px"><h3>Match history</h3>${data.matches.length?data.matches.map(m=>`<div class="history"><div class="row"><strong>vs ${esc(m.opponent)}</strong><span class="pill">${m.result}</span></div><div class="muted small">${m.competition} • ${m.minutes} min • ${m.goals} goals • ${m.assists} assists • ${m.rating}/10 ${m.potm?"• Player of the Match":""}</div></div>`).join(""):'<div class="empty">No matches recorded yet.</div>'}</div>`;
$("#saveMatch").onclick=()=>{let m={opponent:$("#opponent").value.trim(),competition:$("#competition").value,result:$("#result").value,minutes:Number($("#minutes").value),goals:Number($("#goals").value),assists:Number($("#assists").value),rating:Number($("#rating").value),potm:$("#potm").value==="yes"};if(!m.opponent||m.minutes<0||m.minutes>120||m.rating<1||m.rating>10||[m.goals,m.assists].some(x=>x<0)){toast("Check the match details and try again");return}data.matches.unshift(m);save();render("matches");toast("Match saved!")}}
if(page==="scouting"){v.innerHTML=`<div class="card"><h2>Scouting notebook</h2><p class="muted">Keep private observations about players you have permission to assess. This MVP uses fictional sample profiles only.</p><div class="field"><label>PLAYER / PROFILE LABEL</label><input id="scoutname" placeholder="Player name or nickname"></div><div class="field"><label>POSITION</label><select id="scoutpos"><option>GK</option><option>CB</option><option>FB</option><option>CDM</option><option>CM</option><option>CAM</option><option>Winger</option><option>ST</option></select></div><div class="field"><label>OBSERVATIONS</label><textarea id="scoutnotes" rows="4" placeholder="Playing style, strengths, areas to develop..."></textarea></div><button class="btn" id="saveScout">Save scouting note</button></div><div class="card" style="margin-top:16px"><h3>My scouting notes</h3>${data.scouts.length?data.scouts.map(s=>`<div class="history"><strong>${esc(s.name)} • ${s.position}</strong><div class="muted small">${esc(s.notes)}</div></div>`).join(""):'<div class="empty">No scouting notes yet.</div>'}</div>`;
$("#saveScout").onclick=()=>{let name=$("#scoutname").value.trim(),notes=$("#scoutnotes").value.trim();if(!name||!notes){toast("Add a profile label and observations");return}data.scouts.unshift({name,position:$("#scoutpos").value,notes});save();render("scouting");toast("Scouting note saved")}}
}
function addXP(n){data.xp+=n;while(data.xp>=500){data.xp-=500;data.level++}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
render();
</script>
</body>
</html>
